name: ci

on:
  push:
    branches: [ main, v* ]
  pull_request:
    branches: [ main, v* ]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        architecture: [ x64 ]
        configuration: [ debug, release ]
        os: [ windows ]
    steps:
    - uses: actions/checkout@v7
    - run: ./scripts/cibuild.cmd -configuration ${{ matrix.configuration }} -architecture ${{ matrix.architecture }}
      shell: cmd
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: |
          ./artifacts/bin/**/*
          ./artifacts/log/**/*
          ./artifacts/tst/**/*
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}_${{ matrix.configuration }}_${{ matrix.architecture }}_pkg
        path: |
          ./artifacts/pkg/**/*
        if-no-files-found: error
  windows-arm64:
    runs-on: ${{ matrix.os }}-11-arm
    strategy:
      matrix:
        architecture: [ arm64 ]
        configuration: [ debug, release ]
        os: [ windows ]
    steps:
    - uses: actions/checkout@v7
    - run: ./scripts/cibuild.cmd -configuration ${{ matrix.configuration }} -architecture ${{ matrix.architecture }}
      shell: cmd
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: |
          ./artifacts/bin/**/*
          ./artifacts/log/**/*
          ./artifacts/tst/**/*
        if-no-files-found: error
  linux-x64:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        architecture: [ x64 ]
        configuration: [ debug, release ]
        os: [ ubuntu ]
    steps:
    - uses: actions/checkout@v7
    - run: ./scripts/cibuild.sh --configuration ${{ matrix.configuration }} --architecture ${{ matrix.architecture }}
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: |
          ./artifacts/bin/**/*
          ./artifacts/log/**/*
          ./artifacts/tst/**/*
        if-no-files-found: error
  linux-arm64:
    runs-on: ${{ matrix.os }}-24.04-arm
    strategy:
      matrix:
        architecture: [ arm64 ]
        configuration: [ debug, release ]
        os: [ ubuntu ]
    steps:
    - uses: actions/checkout@v7
    - run: ./scripts/cibuild.sh --configuration ${{ matrix.configuration }} --architecture ${{ matrix.architecture }}
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: |
          ./artifacts/bin/**/*
          ./artifacts/log/**/*
          ./artifacts/tst/**/*
        if-no-files-found: error
  macos-arm64:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        architecture: [ arm64 ]
        configuration: [ debug, release ]
        os: [ macos ]
    steps:
    - uses: actions/checkout@v7
    # libLLVM 23.1.5 was linked against this Homebrew Z3 ABI.
    - name: Install libLLVM Z3 dependency
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        set -euo pipefail
        brew tap-new llvmsharp/ci
        formula="$(brew --repository llvmsharp/ci)/Formula/z3.rb"
        curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-core/768a1d39b034c6912104191026e3dd940289e8b2/Formula/z/z3.rb -o "$formula"
        brew install llvmsharp/ci/z3
    - run: ./scripts/cibuild.sh --configuration ${{ matrix.configuration }} --architecture ${{ matrix.architecture }}
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: |
          ./artifacts/bin/**/*
          ./artifacts/log/**/*
          ./artifacts/tst/**/*
        if-no-files-found: error
  sign-nuget:
    runs-on: windows-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs: [ windows-x64, windows-arm64, linux-x64, linux-arm64, macos-arm64 ]
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
        path: ./artifacts/pkg
        pattern: "*_release_*_pkg"
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: ./global.json
    - run: dotnet tool install --tool-path ./artifacts/tools --prerelease sign
    - uses: azure/login@v3
      with:
        allow-no-subscriptions: true
        client-id: "${{ secrets.AZURE_CLIENT_ID }}"
        tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
    - run: ./artifacts/tools/sign code azure-key-vault "**/*.nupkg" --base-directory "${{ github.workspace }}/artifacts/pkg" --file-list "${{ github.workspace }}/scripts/SignClientFileList.txt" --publisher-name ".NET Foundation" --description "LLVMSharp" --description-url "https://github.com/dotnet/llvmsharp" --azure-credential-type "azure-cli" --azure-key-vault-url "${{ secrets.KEY_VAULT_URL }}" --azure-key-vault-certificate "${{ secrets.KEY_VAULT_CERTIFICATE_ID }}"
      shell: pwsh
    - uses: actions/upload-artifact@v7
      with:
        name: sign_nuget
        path: |
          ./artifacts/pkg/**/*
        if-no-files-found: error
